name: Build streak rankings now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-streak-rankings-now.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build streak rankings
        run: python scripts/build_tournament_streaks.py
      - name: Commit generated ranking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/streak-leaders.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate Saturday-week streak rankings"
          git push
