name: Build one-time streak snapshot

on:
  push:
    branches:
      - agent/calculate-streak-top10

permissions:
  contents: write

jobs:
  build-streak-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate streak rankings
        run: python scripts/build_tournament_streaks.py

      - name: Commit generated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/streak-leaders.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Generate one-time streak ranking snapshot"
          git push
