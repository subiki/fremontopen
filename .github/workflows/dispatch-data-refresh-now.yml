name: Dispatch data refresh now

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-data-refresh-now.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing refresh workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run data-refresh.yml --repo "${{ github.repository }}" --ref main
